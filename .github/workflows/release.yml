name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  subtitle-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build subtitle exe zip
        working-directory: desktop-subtitle
        run: |
          npm ci
          npm run dist
      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-subtitle/dist/*.zip
